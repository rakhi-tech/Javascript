<body>
    <script>
        function comparePrice(product1,product2){
            if(product1.price <product2.price){
                return product1;

            }else{
                return product2;
            }
        }
      const productA = {
        name:'football',
        price:1595
      };
      const productB = {
        name:'basketball',
        price:1789
      };
      const cheaperProduct= comparePrice(productA,productB);
     console.log('cheaper product is:',cheaperProduct);
    </script>
</body>
