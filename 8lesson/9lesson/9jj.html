<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="textBox" placeholder="Type something">
  <button onclick="updateMessage()">Submit</button>

  <p id="message"></p>

  <script>
    function updateMessage() {
      const value = document.getElementById('textBox').value;
      document.getElementById('message').innerText = `You entered: ${value}`;
    }
  </script>
    
</body>
</html>
